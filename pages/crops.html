<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crops Management</title>
    <!-- Tailwind CSS for a clean, modern look -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for a clean, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
       <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Default light mode colors */
            background-color: #f7fdee;
            color: #1a202c;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .tab-active {
            @apply text-lime-800 bg-lime-100 font-semibold;
        }

        /* Dark mode colors */
        body.dark-mode {
            background-color: #1a202c;
            color: #e2e8f0;
        }
        .dark-mode .bg-white {
            background-color: #2d3748;
        }
        .dark-mode .bg-lime-50 {
            background-color: #1a202c;
        }
        .dark-mode .bg-yellow-100 {
            background-color: #4a5568;
            color: #a0aec0;
        }
        .dark-mode .text-lime-800 {
            color: #d1d5db; /* Light gray for contrast */
        }
        .dark-mode .tab-active {
            background-color: #4a5568;
            color: #d1d5db;
        }
        .dark-mode .hover\\:bg-gray-100:hover {
            background-color: #4a5568;
        }
        .dark-mode .text-gray-600 {
            color: #a0aec0;
        }
        .dark-mode .text-green-700 {
            color: #68d391; /* A lighter green for dark mode */
        }
        .dark-mode .text-gray-700 {
            color: #e2e8f0;
        }
        .dark-mode .text-green-600 {
            color: #68d391;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-white shadow-sm py-8">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-4xl font-bold text-gray-700">Crops Management</h1>
            <p class="text-gray-600 mt-2">View, add, and manage your farm's crops.</p>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container mx-auto px-4 py-8">

        <!-- User ID and Authentication Status -->
        <div class="bg-yellow-100 text-yellow-800 p-3 rounded-xl shadow-inner mb-6 text-sm text-center">
            Your User ID: <span id="userIdDisplay" class="font-bold text-gray-700">Loading...</span>
            <div id="authStatus" class="mt-1"></div>
        </div>

        <!-- Dashboard Navigation Tabs -->
        <div class="bg-white rounded-2xl shadow-lg p-2 mb-8 flex justify-center space-x-2 md:space-x-4 overflow-x-auto">
            <a href="index.html" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="crops.html" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 tab-active text-blue-600 bg-gray-100 font-semibold">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM13 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2h-2zM13 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2h-2z"></path></svg>
                <span>Crops</span>
            </a>
            <a href="animals.html" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M11 6a3 3 0 11-6 0 3 3 0 016 0zM14 9a3 3 0 11-6 0 3 3 0 016 0zM14 17a3 3 0 11-6 0 3 3 0 016 0zM11 14a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Animals</span>
            </a>
            <a href="employees.html" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zM2 17a3 3 0 116 0 3 3 0 01-6 0zM16 17a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Employees</span>
            </a>
            <a href="customers.html" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM10 18a3 3 0 11-6 0 3 3 0 016 0zM16 18a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Customers</span>
            </a>
            <a href="finances.html" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M4 4h12a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v8h12V6H4zm0 2h12V6H4v2z"></path></svg>
                <span>Finances</span>
            </a>
            <a href="inventory.html" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zM8 9a1 1 0 11-2 0 1 1 0 012 0zM12 9a1 1 0 11-2 0 1 1 0 012 0zM14 9a1 1 0 11-2 0 1 1 0 012 0zM10 13a1 1 0 11-2 0 1 1 0 012 0z"></path></svg>
                <span>Inventory</span>
            </a>
        </div>

        <!-- Add New Crop Collapsible Section -->
        <details class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <summary class="flex justify-between items-center cursor-pointer text-2xl font-semibold text-gray-800 mb-4 focus:outline-none">
                <span>Add New Crop</span>
                <svg class="w-6 h-6 transform transition-transform duration-200" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </summary>
            <form id="addCropForm" class="space-y-4">
                <div>
                    <label for="cropName" class="block text-sm font-medium text-gray-700">Crop Name</label>
                    <input type="text" id="cropName" name="cropName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <div>
                    <label for="cropType" class="block text-sm font-medium text-gray-700">Type</label>
                    <select id="cropType" name="cropType" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                        <!-- New placeholder option added here -->
                        <option value="" disabled selected>Select Crop Type...</option>
                        <option value="Vegetables">Vegetables</option>
                        <option value="Fruits">Fruits</option>
                        <option value="Grains">Grains</option>
                        <option value="Herbs">Herbs</option>
                        <option value="Legumes">Legumes</option>
                        <option value="Other">Other...</option>
                    </select>
                </div>
                <div id="otherTypeContainer" class="hidden">
                    <label for="otherCropType" class="block text-sm font-medium text-gray-700">Specify Other Type</label>
                    <input type="text" id="otherCropType" name="otherCropType" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <div>
                    <label for="plantingDate" class="block text-sm font-medium text-gray-700">Planting Date</label>
                    <input type="date" id="plantingDate" name="plantingDate" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <div>
                    <label for="harvestDate" class="block text-sm font-medium text-gray-700">Expected Harvest Date</label>
                    <input type="date" id="harvestDate" name="harvestDate" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <div>
                    <label for="location" class="block text-sm font-medium text-gray-700">Location</label>
                    <input type="text" id="location" name="location" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <div>
                    <label for="notes" class="block text-sm font-medium text-gray-700">Notes</label>
                    <textarea id="notes" name="notes" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"></textarea>
                </div>
                <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">Add Crop</button>
            </form>
        </details>

        <div class="bg-white rounded-2xl shadow-lg p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold text-gray-800">Current Crops</h2>
                <button id="downloadBtn" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors duration-200">Download Data</button>
            </div>
            <div id="cropsTableContainer" class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Crop Name</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Planting Date</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Expected Harvest Date</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Location</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Notes</th>
                        </tr>
                    </thead>
                    <tbody id="cropsTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Crop data will be populated here by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div id="loadingMessage" class="text-center text-gray-500 mt-4">Loading crops...</div>
            <div id="noCropsMessage" class="hidden text-center text-gray-500 mt-4">No crops found. Add one above!</div>
        </div>

    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, addDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase configuration and app ID are globally provided
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const userIdDisplay = document.getElementById('userIdDisplay');
        const authStatus = document.getElementById('authStatus');
        const addCropForm = document.getElementById('addCropForm');
        const cropsTableBody = document.getElementById('cropsTableBody');
        const loadingMessage = document.getElementById('loadingMessage');
        const noCropsMessage = document.getElementById('noCropsMessage');
        const downloadBtn = document.getElementById('downloadBtn');
        const cropTypeSelect = document.getElementById('cropType');
        const otherTypeContainer = document.getElementById('otherTypeContainer');
        const otherCropTypeInput = document.getElementById('otherCropType');

        let currentUserId = null;
        let allCropsData = []; // Store the fetched data for download

        // Function to handle authentication and update UI
        const authenticate = async () => {
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                    authStatus.textContent = 'Signed in with custom token.';
                } else {
                    await signInAnonymously(auth);
                    authStatus.textContent = 'Signed in anonymously.';
                }
            } catch (error) {
                console.error("Authentication Error:", error);
                authStatus.textContent = 'Authentication failed. Please try again.';
            }
        };

        // Listen for authentication state changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                userIdDisplay.textContent = currentUserId;
                setupCropsListener();
            } else {
                currentUserId = null;
                userIdDisplay.textContent = 'Not authenticated';
                authStatus.textContent = 'Please sign in.';
                currentUserId = crypto.randomUUID();
                userIdDisplay.textContent = 'Not authenticated (using temp ID)';
                setupCropsListener();
            }
        });

        // Function to set up the real-time listener for crops
        const setupCropsListener = () => {
            if (!currentUserId) {
                return;
            }

            const cropsCollectionRef = collection(db, `artifacts/${appId}/public/data/crops`);

            onSnapshot(cropsCollectionRef, (snapshot) => {
                const crops = [];
                snapshot.forEach((doc) => {
                    crops.push({ id: doc.id, ...doc.data() });
                });
                
                crops.sort((a, b) => a.cropName.localeCompare(b.cropName));
                
                allCropsData = crops;
                renderCropsTable(crops);
            }, (error) => {
                console.error("Error fetching crops:", error);
                loadingMessage.textContent = 'Error loading crops. Please try again.';
            });
        };

        // Function to render crops in the table
        const renderCropsTable = (crops) => {
            cropsTableBody.innerHTML = '';
            loadingMessage.classList.add('hidden');
            
            if (crops.length === 0) {
                noCropsMessage.classList.remove('hidden');
            } else {
                noCropsMessage.classList.add('hidden');
                crops.forEach(crop => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-100 transition-colors duration-150';
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${crop.cropName || 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${crop.cropType || 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${crop.plantingDate || 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${crop.harvestDate || 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${crop.location || 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${crop.notes || 'N/A'}</td>
                    `;
                    cropsTableBody.appendChild(row);
                });
            }
        };

        // Function to download data as CSV
        const downloadCSV = (data) => {
            if (!data || data.length === 0) {
                return;
            }

            const headers = ["Crop Name", "Type", "Planting Date", "Expected Harvest Date", "Location", "Notes"];
            const headerRow = headers.join(',');
            
            const csvRows = data.map(crop => {
                const row = [
                    `"${crop.cropName || ''}"`,
                    `"${crop.cropType || ''}"`,
                    `"${crop.plantingDate || ''}"`,
                    `"${crop.harvestDate || ''}"`,
                    `"${crop.location || ''}"`,
                    `"${crop.notes || ''}"`
                ].join(',');
                return row;
            });

            const csvContent = [headerRow, ...csvRows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', 'crops_data.csv');
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };

        // Event listener for the download button
        downloadBtn.addEventListener('click', () => {
            downloadCSV(allCropsData);
        });

        // Event listener for the crop type dropdown to show/hide the "Other" input
        cropTypeSelect.addEventListener('change', (event) => {
            if (event.target.value === 'Other') {
                otherTypeContainer.classList.remove('hidden');
                otherCropTypeInput.required = true;
            } else {
                otherTypeContainer.classList.add('hidden');
                otherCropTypeInput.required = false;
            }
        });

        // Handle form submission to add a new crop
        addCropForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            
            const selectedCropType = form.cropType.value;
            const finalCropType = selectedCropType === 'Other' ? form.otherCropType.value : selectedCropType;

            const cropData = {
                cropName: form.cropName.value,
                cropType: finalCropType,
                plantingDate: form.plantingDate.value,
                harvestDate: form.harvestDate.value,
                location: form.location.value,
                notes: form.notes.value,
                addedBy: currentUserId
            };

            try {
                const cropsCollectionRef = collection(db, `artifacts/${appId}/public/data/crops`);
                await addDoc(cropsCollectionRef, cropData);
                form.reset();
            } catch (error) {
                console.error("Error adding crop:", error);
            }
        });

        window.onload = authenticate;
    </script>
</body>
</html>
