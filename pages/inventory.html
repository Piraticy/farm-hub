<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <!-- Tailwind CSS for a clean, modern look -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for a clean, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="assets/theme.css">
    <script defer src="assets/theme.js"></script>
    <style>
        .details-summary-icon {
            transition: transform 0.3s ease-in-out;
        }
        details[open] .details-summary-icon {
            transform: rotate(180deg);
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FarmHub">
    <script defer src="assets/pwa.js"></script>
    <script src="assets/auth.js"></script>
    <script>FarmHubAuth.guardPage('inventory');</script>
</head>
<body class="bg-gray-100 fh-shell" data-page="inventory">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 sm:py-6 fh-shell-header">
        <div class="container mx-auto px-4 flex items-center justify-between gap-2 sm:gap-4">
            <a href="index.html" class="brand-mark">
                <img src="favicon.svg" alt="">
                <span class="hidden sm:inline">FarmHub</span>
            </a>
            <div class="text-center flex-1 min-w-0">
                <h1 class="text-lg sm:text-2xl md:text-3xl font-bold text-gray-700 truncate">Inventory Management</h1>
                <p class="hidden sm:block text-gray-600 text-sm mt-1">View, add, and manage your farm's inventory.</p>
            </div>
            <div class="flex items-center gap-1 sm:gap-2 shrink-0">
                <button id="logoutBtn" title="Log out" aria-label="Log out" class="p-2 sm:p-3 rounded-full shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 transition-colors duration-200">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                </button>
                <button id="installBtn" class="hidden p-2 sm:p-3 rounded-full shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 transition-colors duration-200" title="Install app" aria-label="Install app">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"></path>
                    </svg>
                </button>
                <button id="themeToggle" class="p-2 sm:p-3 rounded-full shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 transition-colors duration-200">
                <svg id="moon-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
                <svg id="sun-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="container mx-auto px-4 pt-4 fh-shell-nav">

        <!-- Dashboard Navigation Tabs -->
        <div class="bg-white rounded-2xl shadow-lg p-2 mb-8 flex flex-wrap justify-center gap-2">
            <a href="index.html" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="crops.html" data-feature="crops" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM13 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2h-2zM13 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2h-2z"></path></svg>
                <span>Crops</span>
            </a>
            <a href="animals.html" data-feature="animals" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M11 6a3 3 0 11-6 0 3 3 0 016 0zM14 9a3 3 0 11-6 0 3 3 0 016 0zM14 17a3 3 0 11-6 0 3 3 0 016 0zM11 14a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Animals</span>
            </a>
            <a href="employees.html" data-feature="employees" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zM2 17a3 3 0 116 0 3 3 0 01-6 0zM16 17a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Employees</span>
            </a>
            <a href="customers.html" data-feature="customers" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM10 18a3 3 0 11-6 0 3 3 0 016 0zM16 18a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Customers</span>
            </a>
            <a href="finances.html" data-feature="finances" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 hover:bg-gray-100 text-gray-600">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M4 4h12a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v8h12V6H4zm0 2h12V6H4v2z"></path></svg>
                <span>Finances</span>
            </a>
            <a href="inventory.html" data-feature="inventory" class="flex items-center space-x-2 py-2 px-4 rounded-xl transition-colors duration-200 tab-active">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zM8 9a1 1 0 11-2 0 1 1 0 012 0zM12 9a1 1 0 11-2 0 1 1 0 012 0zM14 9a1 1 0 11-2 0 1 1 0 012 0zM10 13a1 1 0 11-2 0 1 1 0 012 0z"></path></svg>
                <span>Inventory</span>
            </a>
        </div>
    </div>

    <main class="container mx-auto px-4 pb-8 fh-shell-content">

        <!-- Add New Inventory Item Section -->
        <details class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <summary class="flex justify-between items-center cursor-pointer text-2xl font-semibold text-gray-800 mb-4 focus:outline-none">
                <span>Add New Inventory Item</span>
                <svg class="details-summary-icon w-6 h-6 transform transition-transform duration-200" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </summary>
            <form id="addItemForm" class="space-y-4">
                <div>
                    <label for="itemName" class="block text-sm font-medium text-gray-700">Item Name</label>
                    <input type="text" id="itemName" name="itemName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <div>
                    <label for="itemCategory" class="block text-sm font-medium text-gray-700">Category</label>
                    <select id="itemCategory" name="itemCategory" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                        <option value="" disabled selected>Select a category...</option>
                        <option value="Tools">Tools</option>
                        <option value="Seeds">Seeds</option>
                        <option value="Fertilizers">Fertilizers</option>
                        <option value="Animal Feed">Animal Feed</option>
                        <option value="Equipment">Equipment</option>
                        <option value="Building Materials">Building Materials</option>
                        <option value="General Supplies">General Supplies</option>
                        <option value="Machinery">Machinery</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label for="itemQuantity" class="block text-sm font-medium text-gray-700">Quantity</label>
                    <input type="number" id="itemQuantity" name="itemQuantity" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <div>
                    <label for="itemNotes" class="block text-sm font-medium text-gray-700">Notes</label>
                    <textarea id="itemNotes" name="itemNotes" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"></textarea>
                </div>
                <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">Add Item</button>
                <div id="statusMessage" class="mt-2 text-sm text-center"></div>
            </form>
        </details>

        <!-- Current Inventory Table Section -->
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold text-gray-800">Current Inventory</h2>
                <button id="downloadBtn" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors duration-200">Download Data</button>
            </div>
            <div id="inventoryTableContainer" class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Item Name</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quantity</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Notes</th>
                            <th scope="col" class="relative px-6 py-3"><span class="sr-only">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Inventory data will be populated here by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div id="loadingMessage" class="flex items-center justify-center space-x-2 text-center text-gray-500 mt-4">
                <svg class="spinner w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Loading inventory...</span>
            </div>
            <div id="noInventoryMessage" class="hidden text-center text-gray-500 mt-4">No inventory items found. Add one above!</div>
        </div>

    </main>

    <!-- Data is stored locally in this browser (localStorage) -->
    <script>
        const STORAGE_KEY = 'farmhub_inventory';
        const loadInventory = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const saveInventory = (inventory) => localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));

        const addItemForm = document.getElementById('addItemForm');
        const inventoryTableBody = document.getElementById('inventoryTableBody');
        const loadingMessage = document.getElementById('loadingMessage');
        const noInventoryMessage = document.getElementById('noInventoryMessage');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusMessage = document.getElementById('statusMessage');

        let allInventoryData = loadInventory();

        // Function to render inventory in the table
        const renderInventoryTable = (inventory) => {
            inventoryTableBody.innerHTML = '';
            loadingMessage.classList.add('hidden');

            if (inventory.length === 0) {
                noInventoryMessage.classList.remove('hidden');
            } else {
                noInventoryMessage.classList.add('hidden');
                inventory.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-100 transition-colors duration-150';
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.itemName || 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.itemCategory || 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.itemQuantity || 0}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.itemNotes || 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button class="text-red-600 hover:text-red-900 transition-colors duration-200" data-id="${item.id}">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm6 0a1 1 0 11-2 0v6a1 1 0 112 0V8z" clip-rule="evenodd"></path></svg>
                            </button>
                        </td>
                    `;
                    inventoryTableBody.appendChild(row);
                });
            }
        };

        // Function to download data as CSV
        const downloadCSV = (data) => {
            if (!data || data.length === 0) {
                return;
            }

            const headers = ["Item Name", "Category", "Quantity", "Notes"];
            const headerRow = headers.join(',');
            
            const csvRows = data.map(item => {
                const row = [
                    `"${item.itemName || ''}"`,
                    `"${item.itemCategory || ''}"`,
                    `"${item.itemQuantity || ''}"`,
                    `"${item.itemNotes || ''}"`
                ].join(',');
                return row;
            });

            const csvContent = [headerRow, ...csvRows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', 'inventory_data.csv');
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };

        // Event listener for the download button
        downloadBtn.addEventListener('click', () => {
            downloadCSV(allInventoryData);
        });

        // Handle form submission to add a new inventory item
        addItemForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const form = e.target;
            const itemData = {
                id: crypto.randomUUID(),
                itemName: form.itemName.value,
                itemCategory: form.itemCategory.value,
                itemQuantity: parseInt(form.itemQuantity.value, 10),
                itemNotes: form.itemNotes.value
            };

            allInventoryData.push(itemData);
            allInventoryData.sort((a, b) => (a.itemName || '').localeCompare(b.itemName || ''));
            saveInventory(allInventoryData);
            renderInventoryTable(allInventoryData);
            form.reset();
            statusMessage.textContent = '✅ Item added successfully!';
            statusMessage.className = 'mt-2 text-sm text-center text-green-600';
            setTimeout(() => {
                statusMessage.textContent = '';
                statusMessage.className = 'mt-2 text-sm text-center';
            }, 3000);
        });

        // Handle deletion of an inventory item
        inventoryTableBody.addEventListener('click', (e) => {
            const deleteButton = e.target.closest('button');
            if (deleteButton) {
                const itemId = deleteButton.dataset.id;
                if (itemId) {
                    allInventoryData = allInventoryData.filter(item => item.id !== itemId);
                    saveInventory(allInventoryData);
                    renderInventoryTable(allInventoryData);
                }
            }
        });

        renderInventoryTable(allInventoryData);
    </script>
</body>
</html>
